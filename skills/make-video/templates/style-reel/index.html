<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="lib/fonts.css">
<style>
  .mv-clip { position: absolute; }
  .plate { position: absolute; left: 6%; bottom: 7%; padding: .55em .9em .7em; border-radius: .45em; max-width: 80%; }
  .name { white-space: nowrap; }
  .tag { margin-top: .35em; text-wrap: balance; }
  .portrait .plate { bottom: 22%; max-width: 76%; }
  .card-title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
</style>
</head>
<body>
<script type="module">
// Style reel: one 3.5 s vignette per preset, each built from that style's
// signature techniques — read a vignette as a recipe for the style. Scenes are
// sized to the 120 bpm beat (0.5 s), so every wipe starts on a beat.
// Everything drawn here is abstract shapes and type — no characters.
import { defineVideo, ease, clamp, css, h, splitText, stepTime, hash, alpha, TAU } from './lib/mv.js';
import { themes, themeNames } from './lib/mv-themes.js';
import {
  backdrop, themeBackground, paperShape, blobPoints, circlePoints, starPoints, hatch, sketch, sketchCircle, sketchArrow,
  sketchRect, risoLayer, halftone, iso, chalk, boil, polyPath,
} from './lib/mv-draw.js';

const W = {{WIDTH}}, H = {{HEIGHT}}, FPS = {{FPS}};
const u = Math.min(W, H);
const BPM = 120, BEAT = 60 / BPM;
const SEG = 7 * BEAT;   // 3.5 s per vignette; the 0.5 s wipe overlap keeps cuts on the beat
const fsz = (k) => `${Math.round(u * k)}px`;
if (H > W) document.documentElement.classList.add('portrait');

/** Run `fn` with the canvas clipped to a polygon. */
function clipTo(ctx, pts, fn) {
  ctx.save();
  polyPath(ctx, pts);
  ctx.clip();
  fn();
  ctx.restore();
}
/** Name + tagline on a backing plate in the theme's colors and fonts. */
function label(el, th, tag) {
  const plate = h('div', { class: 'plate', style: { background: alpha(th.palette.bg, 0.88), boxShadow: `0 6px 24px ${alpha('#000', 0.12)}` } },
    h('div', { class: 'name', style: { font: `${th.weights?.display ?? 800} ${fsz(0.1)}/1 ${th.fonts.display}`, color: th.palette.ink } }, th.name),
    h('div', { class: 'tag', style: { font: `${th.weights?.body ?? 500} ${fsz(0.044)}/1.2 ${th.fonts.body}`, color: alpha(th.palette.ink, 0.8) } }, tag));
  el.append(plate);
  const name = plate.querySelector('.name');
  splitText(name);
  if (th.key === 'kinetic-type') name.querySelectorAll('.mv-word').forEach((w) => css(w, { overflow: 'hidden', verticalAlign: 'top' }));
}
function animateLabel(s, th, stepped) {
  const t = stepped ? stepTime(s.t, 12) : s.t;
  css(s.$('.plate'), { opacity: s.at(0.45, 0.7) });
  splitText(s.$('.name')).chars.forEach((c, i) => {
    const p = clamp((t - 0.5 - i * 0.035) / 0.45);
    if (th.key === 'kinetic-type') css(c, { y: `${(1 - ease.outExpo(p)) * 100}%`, opacity: 1 });
    else css(c, { y: (1 - ease.outBack(p)) * 36, opacity: clamp(p * 3) });
  });
  css(s.$('.tag'), { opacity: s.at(1.0, 1.4), x: (1 - s.at(1.0, 1.5, ease.outCubic)) * -20 });
}
const vignette = (key, tag, draw, { stepped = false } = {}) => ({
  name: key, duration: SEG, label: themes[key].name, note: tag, canvas: true,
  build(el) { el.style.background = themes[key].palette.bg; label(el, themes[key], tag); },
  render(t, s) {
    const th = themes[key];
    backdrop(s.ctx, th, t, W, H, { motif: false });
    draw(s.ctx, t, s, th);
    animateLabel(s, th, stepped);
  },
});

const scenes = [
  {
    name: 'intro', duration: 5 * BEAT, label: 'Intro', note: 'Seven looks, one runtime.',
    build(el) {
      el.style.background = '#111114';
      el.append(h('div', { class: 'card-title', style: { font: `400 ${fsz(0.13)}/1 'Anton', sans-serif`, color: '#f2f0ea', textTransform: 'uppercase' } }, 'Seven styles'),
        h('div', { class: 'card-title', style: { top: '65%', font: `500 ${fsz(0.05)}/1 'Inter', sans-serif`, color: '#c9c9d3' } }, 'one function of time'));
      const big = el.querySelector('.card-title');
      splitText(big);
      big.querySelectorAll('.mv-word').forEach((w) => css(w, { overflow: 'hidden', verticalAlign: 'top' }));
    },
    render(t, s) {
      const [big, small] = s.$$('.card-title');
      splitText(big).chars.forEach((c, i) => css(c, { y: `${(1 - ease.outExpo(clamp((t - 0.1 - i * 0.04) / 0.4))) * 110}%` }));
      css(small, { opacity: s.at(0.8, 1.2), x: '-50%', y: '-50%' });
    },
  },
  vignette('cut-paper', 'construction paper, real shadows, shot on twos', (ctx, t, s, th) => {
    const C = th.palette.colors, ts = stepTime(t, 12);
    const hill = (x, y, r, c, seed, delay) => {
      const p = ease.outBack(clamp((ts - delay) / 0.5));
      paperShape(ctx, blobPoints(x, y + (1 - p) * H * 0.4, r, { seed, wobble: 0.07 }), { color: c, seed, dy: 10 });
    };
    hill(W * 0.15, H * 1.16, u * 0.4, C[4], 3, 0.0);
    hill(W * 0.95, H * 1.12, u * 0.45, C[3], 7, 0.12);
    hill(W * 0.6, H * 1.25, u * 0.4, C[1], 5, 0.24);
    const sunP = ease.outBack(clamp((ts - 0.45) / 0.6));
    paperShape(ctx, starPoints(W * 0.72, H * 0.3, u * 0.14 * sunP + 1, u * 0.1 * sunP + 1, 12, ts * 0.4), { color: C[0], seed: 11 });
    paperShape(ctx, circlePoints(W * 0.72, H * 0.3, u * 0.085 * sunP + 1, 40), { color: C[1], seed: 12 });
    for (let i = 0; i < 3; i++) {
      const x = W * (0.3 + i * 0.12) + Math.sin(ts * 0.8 + i) * u * 0.02, y = H * (0.2 + (i % 2) * 0.08);
      paperShape(ctx, blobPoints(x, y, u * 0.05, { seed: 20 + i, wobble: 0.25, n: 24 }), { color: C[6], seed: 20 + i, blur: 10, dy: 6 });
    }
  }, { stepped: true }),
  vignette('cross-hatch', 'ink, hatching and a single red accent', (ctx, t, s, th) => {
    const sd = boil(t, 8), ink = th.palette.ink;
    const cx = W * 0.66, cy = H * 0.4, r = u * 0.19, ground = cy + r * 1.05;
    const ring = circlePoints(cx, cy, r, 64);
    // Cast shadow on the ground, then light → mid → dark tones toward the lower right.
    hatch(ctx, circlePoints(cx + r * 0.35, ground, r * 1.1, 48, r * 0.16), { gap: 6, angle: 10, cross: true, color: ink, seed: sd + 1, width: 1.1, progress: s.at(0.9, 1.6), alpha: 0.7 });
    clipTo(ctx, ring, () => {
      hatch(ctx, ring, { gap: 13, angle: -40, color: ink, seed: sd + 3, width: 1.1, progress: s.at(0.4, 1.2), alpha: 0.6 });
      hatch(ctx, circlePoints(cx + r * 0.45, cy + r * 0.4, r * 0.95, 48), { gap: 8, angle: -40, color: ink, seed: sd + 4, width: 1.2, progress: s.at(0.7, 1.6) });
      hatch(ctx, circlePoints(cx + r * 0.75, cy + r * 0.7, r * 0.8, 48), { gap: 6, angle: 50, color: ink, seed: sd + 5, width: 1.2, progress: s.at(1.0, 1.9) });
    });
    sketchCircle(ctx, cx, cy, r, { color: ink, width: 3, seed: sd, progress: s.at(0.05, 0.8) });
    sketch(ctx, [[W * 0.06, ground], [W * 0.98, ground]], { color: ink, width: 2.2, seed: sd + 5, progress: s.at(0.2, 1.0) });
    sketchArrow(ctx, W * 0.4, H * 0.14, cx - r * 0.85, cy - r * 0.5, { color: th.palette.accent, width: 3.5, curve: -0.25, seed: sd + 7, progress: s.at(1.5, 2.2) });
  }),
  vignette('risograph', 'spot inks, overprint, grain and misregistration', (ctx, t, s, th) => {
    const k = boil(t, 6), reg = 5;
    const off = (i) => [(hash(k, i) - 0.5) * reg * 2, (hash(k, i, 1) - 0.5) * reg * 2];
    const slide = (d) => ease.snappy(s.at(0.05 + d, 0.6 + d, ease.linear));
    risoLayer(ctx, '#0078bf', (lc) => {
      lc.beginPath(); lc.arc(W * 0.58 - (1 - slide(0)) * W * 0.3, H * 0.38, u * 0.24, 0, TAU); lc.fill();
      halftone(lc, W * 0.45, H * 0.05, W * 0.5, H * 0.6, { value: (a, b) => 1 - b, cell: 16, color: '#0078bf', max: 0.55 });
    }, { w: W, h: H, offset: off(0), key: 0, seed: 3 });
    risoLayer(ctx, '#ff48b0', (lc) => {
      lc.beginPath(); lc.arc(W * 0.76 + (1 - slide(0.12)) * W * 0.3, H * 0.38, u * 0.24, 0, TAU); lc.fill();
      for (let i = 0; i < 6; i++) lc.fillRect(W * 0.46, H * (0.68 + i * 0.03), W * 0.48 * slide(0.3 + i * 0.05), H * 0.012);
    }, { w: W, h: H, offset: off(1), key: 1, seed: 5 });
  }),
  vignette('sketchbook', 'graph paper, drawn-on lines, marker and highlighter', (ctx, t, s, th) => {
    const sd = boil(t, 6), ink = th.palette.ink, C = th.palette.colors;
    const bw = W * 0.17, bh = H * 0.2, ax = W * 0.42, ay = H * 0.16, bx = W * 0.72, by = H * 0.4;
    const word = (txt, x, y, p) => {
      if (p <= 0) return;
      ctx.save();
      ctx.font = `${Math.round(u * 0.075)}px ${th.fonts.hand}`;
      ctx.fillStyle = ink;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const w = ctx.measureText(txt).width;
      ctx.beginPath();
      ctx.rect(x - w / 2 - 4, y - u * 0.06, (w + 8) * p, u * 0.12);
      ctx.clip();
      ctx.fillText(txt, x, y);
      ctx.restore();
    };
    sketchRect(ctx, ax, ay, bw, bh, { color: ink, width: 3.2, seed: sd, progress: s.at(0.05, 0.6) });
    word('idea', ax + bw / 2, ay + bh / 2, s.at(0.5, 0.9));
    sketchArrow(ctx, ax + bw + u * 0.02, ay + bh * 0.6, bx - u * 0.02, by + bh * 0.3, { color: C[1], width: 4.5, curve: -0.3, seed: sd + 8, progress: s.at(0.9, 1.4) });
    const hp = s.at(1.6, 2.0);
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = C[0];
    ctx.fillRect(bx + bw * 0.1, by + bh * 0.36, bw * 0.8 * hp, bh * 0.3);
    ctx.restore();
    sketchRect(ctx, bx, by, bw, bh, { color: ink, width: 3.2, seed: sd + 4, progress: s.at(1.0, 1.5) });
    word('video', bx + bw / 2, by + bh / 2, s.at(1.4, 1.8));
    sketch(ctx, starPoints(W * 0.88, H * 0.14, u * 0.07, u * 0.03), { closed: true, color: C[1], width: 4, seed: sd + 2, progress: s.at(2.0, 2.6) });
  }),
  vignette('isometric', 'thirty-degree blocks, three-tone shading', (ctx, t, s, th) => {
    const C = th.palette.colors;
    const I = iso(W * 0.66, H * 0.52, u * 0.07);
    I.grid(ctx, 8, 8, { x0: -4, y0: -4, color: alpha(th.palette.ink, 0.1) });
    const cells = [];
    for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) if ((x + y + 9) % 2 === 0 || (x === 0 && y === 0)) cells.push([x, y]);
    cells.sort((a, b) => a[0] + a[1] - (b[0] + b[1]));
    // Blocks keep breathing after they rise, and a data packet hops along the front row.
    const hop = s.at(1.6, 3.4, ease.linear) * 4;
    cells.forEach(([x, y], i) => {
      const p = ease.outBack(s.at(0.1 + (x + y + 4) * 0.08, 0.7 + (x + y + 4) * 0.08, ease.linear));
      const pulse = Math.max(0, Math.sin((t - 1.2) * 4 + (x - y))) * 0.15 * s.at(1.2, 1.6);
      const hgt = ((1 + 2.2 * hash(x, y)) + pulse) * p;
      if (hgt <= 0.01) return;
      I.shadow(ctx, x, y, 1, 1, { color: alpha(th.palette.ink, 0.12) });
      I.box(ctx, x, y, 0, 1, 1, hgt, { color: C[(i * 3) % C.length] });
    });
    if (hop > 0) {
      const [px, py] = I.p(-2 + hop + 0.5, 2.5, 0.3 + Math.abs(Math.sin(hop * Math.PI)) * 0.8);
      ctx.fillStyle = th.palette.accent;
      ctx.beginPath();
      ctx.arc(px, py, u * 0.018, 0, TAU);
      ctx.fill();
    }
  }),
  vignette('chalkboard', 'chalk on slate: plots and equations that write themselves', (ctx, t, s, th) => {
    const C = th.palette.colors, ink = th.palette.ink;
    const x0 = W * 0.48, y0 = H * 0.66, gw = W * 0.44, gh = H * 0.44;
    chalk(ctx, [[x0, y0], [x0 + gw, y0]], { color: ink, width: 4, seed: 1, progress: s.at(0.05, 0.5) });
    chalk(ctx, [[x0, y0 + gh * 0.1], [x0, y0 - gh]], { color: ink, width: 4, seed: 2, progress: s.at(0.2, 0.6) });
    const curve = (k, ph) => Array.from({ length: 140 }, (_, i) => { const x = i / 139; return [x0 + x * gw, y0 - gh * 0.5 - Math.sin(x * TAU * k + ph) * gh * 0.32 * (1 - x * 0.4)]; });
    chalk(ctx, curve(1.5, 0), { color: C[0], width: 5, seed: 3, progress: s.at(0.6, 1.8, ease.inOutSine) });
    chalk(ctx, curve(1.5, 1.4), { color: C[2], width: 4, seed: 4, progress: s.at(1.0, 2.2, ease.inOutSine) });
    // The equation writes itself on (a clip sweeping left → right).
    const eq = s.at(1.2, 2.2, ease.linear);
    if (eq > 0) {
      ctx.save();
      ctx.font = `italic ${Math.round(u * 0.08)}px ${th.fonts.math || 'serif'}`;
      ctx.fillStyle = C[1];
      ctx.textBaseline = 'middle';
      const w = ctx.measureText('y = sin(x)').width;
      ctx.beginPath();
      ctx.rect(W * 0.08, H * 0.22, w * eq + 6, u * 0.14);
      ctx.clip();
      ctx.fillText('y = sin(x)', W * 0.08, H * 0.29);
      ctx.restore();
    }
    const p = s.at(1.8, 3.2, ease.inOutSine);
    const px = x0 + p * gw, py = y0 - gh * 0.5 - Math.sin(p * TAU * 1.5) * gh * 0.32 * (1 - p * 0.4);
    ctx.save();
    ctx.fillStyle = C[1];
    ctx.globalAlpha = s.at(1.8, 2.0);
    ctx.beginPath(); ctx.arc(px, py, u * 0.012, 0, TAU); ctx.fill();
    ctx.restore();
  }),
  vignette('kinetic-type', 'huge type, masks, cuts on the beat', (ctx, t, s, th) => {
    // Words land on beats after the wipe: 0.5, 1.5, 2.5 s into the scene.
    const words = ['MAKE', 'IT', 'MOVE'];
    const local = t - BEAT;
    ctx.fillStyle = th.palette.accent;
    ctx.fillRect(W * 0.07, H * 0.12, W * 0.86 * ease.outExpo(s.at(0, 0.6, ease.linear)), H * 0.012);
    if (local < 0) return;
    const k = Math.min(words.length - 1, Math.floor(local / (2 * BEAT)));
    const ph = (local - k * 2 * BEAT) / (2 * BEAT);
    ctx.save();
    ctx.font = `400 ${Math.round(H * 0.42)}px 'Anton', sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    const y = H * 0.62;
    const rise = (1 - ease.outExpo(clamp(ph * 3))) * H * 0.42;
    ctx.beginPath();
    ctx.rect(0, y - H * 0.42, W, H * 0.46);
    ctx.clip();
    ctx.fillStyle = k === 1 ? th.palette.accent : th.palette.ink;
    ctx.fillText(words[k], W * 0.94, y + rise);
    ctx.restore();
  }),
  {
    name: 'outro', duration: 6 * BEAT, label: 'Outro', note: 'All seven looks side by side.', canvas: true,
    build(el, s) {
      el.style.background = '#111114';
      const portrait = H > W;   // keep titles out of the social-app UI zones in 9:16
      el.append(h('div', { class: 'card-title', style: { top: portrait ? '17%' : '13%', font: `400 ${fsz(0.08)}/1 'Anton', sans-serif`, color: '#f2f0ea', textTransform: 'uppercase' } }, 'Pick a style'),
        h('div', { class: 'card-title', style: { top: portrait ? '74%' : '91%', font: `500 ${fsz(0.042)}/1 'Inter', sans-serif`, color: '#c9c9d3' } }, '…or bring a reference'));
      const cols = portrait ? 2 : 4, rows = Math.ceil(themeNames.length / cols);
      const gap = u * 0.02, top = H * (portrait ? 0.22 : 0.23), bottom = H * (portrait ? 0.69 : 0.84);
      const tw = Math.min((W * 0.88 - gap * (cols - 1)) / cols, ((bottom - top - gap * (rows - 1)) / rows) * (16 / 9));
      const th = tw * 9 / 16;
      s.tiles = themeNames.map((key, i) => {
        const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, themeNames.length - r * cols);
        const x0 = (W - (inRow * tw + (inRow - 1) * gap)) / 2;
        return { key, x: x0 + c * (tw + gap), y: top + r * (th + gap), w: tw, h: th };
      });
    },
    render(t, s) {
      const [big, small] = s.$$('.card-title');
      css(big, { opacity: s.at(0, 0.4), x: '-50%', y: '-50%' });
      css(small, { opacity: s.at(1.2, 1.6), x: '-50%', y: '-50%' });
      const ctx = s.ctx;
      s.tiles.forEach((tile, i) => {
        const th = themes[tile.key];
        const p = ease.outBack(s.at(0.2 + i * 0.08, 0.6 + i * 0.08, ease.linear));
        if (p <= 0) return;
        ctx.save();
        ctx.translate(tile.x + tile.w / 2, tile.y + tile.h / 2);
        ctx.scale(p, p);
        ctx.translate(-tile.w / 2, -tile.h / 2);
        ctx.drawImage(themeBackground(th, Math.round(tile.w), Math.round(tile.h)), 0, 0, tile.w, tile.h);
        ctx.fillStyle = th.palette.accent;
        ctx.fillRect(0, tile.h - 6, tile.w, 6);
        ctx.font = `${th.weights?.display ?? 800} ${Math.round(tile.h * 0.17)}px ${th.fonts.display}`;
        ctx.fillStyle = th.palette.ink;
        ctx.textBaseline = 'middle';
        ctx.fillText(th.name, tile.w * 0.08, tile.h * 0.5);
        ctx.restore();
      });
    },
  },
];

defineVideo({
  title: '{{TITLE}}',
  width: W, height: H, fps: FPS,
  background: '#111114',
  transition: { type: 'wipe-right', duration: BEAT, edge: '#ff4d1f', edgeWidth: Math.round(u * 0.014) },
  scenes,
  audio(a) {
    a.drums({ bpm: BPM, gain: 0.18, kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..x...x...x...x.' });
    a.bass({ chords: ['Am', 'F', 'C', 'G'], every: 4 * BEAT, bpm: BPM, gain: 0.16 });
    a.pad({ chords: ['Am', 'F', 'C', 'G'], every: 4 * BEAT, gain: 0.08 });
    for (const sc of a.scenes.slice(1)) a.swish(sc.start, { gain: 0.3 });
    const k = a.scene('kinetic-type').start;
    [1, 3, 5].forEach((b) => a.impact(k + b * BEAT, { gain: 0.22 }));
  },
});
</script>
</body>
</html>
